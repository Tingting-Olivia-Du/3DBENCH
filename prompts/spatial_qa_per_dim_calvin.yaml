# Per-dimension prompts for the CALVIN benchmark (env D).
# Mirrors prompts/spatial_qa_per_dim.yaml but with CALVIN's world-frame ranges
# and the static-camera visual mapping notes — used by PerDimPromptBuilder
# when running LoRA-augmented eval on CALVIN.
#
# Numeric ranges are empirical (computed across all 4320 GT samples).
# Robot base position is from validation/.hydra/merged_config.yaml.

shared_view_note: |
  You will receive TWO images of the same workspace at the same instant:
    - AGENT VIEW: third-person static camera mounted at an angle, looking
      down on the play table from upper-right. The view is NOT head-on,
      so depth/lateral directions in the image do not align with simple X/Y.
    - WRIST VIEW: first-person camera mounted on the gripper.
  Use both — agent view for global geometry, wrist view for proximity.

shared_frame_block: |
  COORDINATE FRAME (CALVIN world frame, in METERS):
  - All positions are in the simulator's WORLD frame.
  - WORLD ORIGIN (0, 0, 0) sits at the play_table URDF origin — a virtual
    point UNDER the table, 0.46 m BELOW the table-top surface (table top
    is at Z = +0.46). The origin is NOT on the table and NOT at the robot
    base.
  - Franka Panda base is at world (-0.34, -0.46, 0.24); the play table is
    in front of it. The robot is offset from the world origin in X- and Y-.
  - Physical axis directions:
      X+ runs along the table's long edge from the bulb/slider side toward
         the led/drawer side.
      Y+ points AWAY from the robot (the robot base is at Y = -0.46);
         Y- points TOWARD the robot.
      Z+ is up.
  - Q6 axis labels (bound to world-axis SIGNS, not camera/image directions):
      X+ → "in_front"   |   Y+ → "left"   |   Z+ → "above"
    "left" = world Y+ = side opposite the robot base. NOT the side a person
    standing behind the robot would call left.
  - Static-camera visual mapping: world X+ projects to image upper-right;
    world Y+ ("left") projects to image-RIGHT (NOT image-left); world Z+
    projects to image up. World X+ and Y+ are hard to distinguish in the
    static view alone — use the wrist view to disambiguate.

  WORKSPACE CONTEXT (empirical, across all GT samples):
  - Play table top: Z ≈ 0.46 m. Drawer interior: Z ≈ 0.36 m.
  - Gripper position range: X ≈ -0.40 to +0.34, Y ≈ -0.44 to +0.08, Z ≈ 0.31 to 0.66
    (mean roughly +0.04, -0.11, +0.51). Y is biased negative because the
    workspace is in front of the robot, which itself sits at Y = -0.46.
  - Block X-Y range: about ±0.34 m on each axis; Z 0.36–0.57 m.
  - Articulated objects (FIXED world positions):
      slider (-0.10, -0.10, 0.55), drawer (0.20, -0.10, 0.40),
      button (0.10, 0.00, 0.51),  switch (-0.05, 0.00, 0.51),
      bulb   (-0.20, 0.00, 0.55), led    (0.20, 0.00, 0.55).
    "green light" in language refers to the LED; "yellow light" / "lightbulb"
    refers to the bulb.

# ---------------------------------------------------------------------------
# Q1 (folded with Q1_dest): source object position + destination position
# ---------------------------------------------------------------------------
q1:
  system: |
    You are an expert in 3D spatial reasoning for robot manipulation on the
    CALVIN play-table benchmark.
    {shared_view_note}
    {shared_frame_block}

    TASK TYPES:
    - "pick_and_place": pick up an object and place it on a destination
      (e.g. another spot on the table, into the slider, into the drawer).
    - "articulation":   manipulate a fixed object in place (open drawer,
      slide door, press button, toggle switch, turn LED/bulb on/off).

    OUTPUT FORMAT:
    Respond with EXACTLY one JSON object containing only the keys
    "task_type", "q1", and "q1_dest". No prose, no markdown, no code fences.

  user: |
    Task description: "{task_description}"

    Q1 — SOURCE OBJECT POSITION (world frame):
    What is the 3D position [x, y, z] of the PRIMARY OBJECT to be manipulated
    (the block to pick up, or the articulated part to actuate)?

    Q1_DEST — DESTINATION POSITION (world frame):
    For "pick_and_place" tasks: the 3D position [x, y, z] of the DESTINATION.
    For "articulation" or pure-lift tasks: set all three components to null.

    Output format:
      {{"task_type": "pick_and_place" | "articulation",
        "q1":      {{"x": <float_meters>, "y": <float_meters>, "z": <float_meters>}},
        "q1_dest": {{"x": <float|null>,  "y": <float|null>,  "z": <float|null>}}}}

# ---------------------------------------------------------------------------
# Q2: end-effector / gripper position
# ---------------------------------------------------------------------------
q2:
  system: |
    You are an expert in 3D spatial reasoning for robot manipulation on the
    CALVIN play-table benchmark.
    {shared_view_note}
    {shared_frame_block}

    OUTPUT FORMAT:
    Respond with EXACTLY one JSON object containing only the key "q2".
    No prose, no markdown, no code fences.

  user: |
    Task description: "{task_description}"

    Q2 — GRIPPER POSITION (world frame):
    What is the current 3D position [x, y, z] of the robot's end-effector
    (gripper center) in CALVIN world coordinates?

    Output format:
      {{"q2": {{"x": <float_meters>, "y": <float_meters>, "z": <float_meters>}}}}

# ---------------------------------------------------------------------------
# Q3: binary can_close
# ---------------------------------------------------------------------------
q3:
  system: |
    You are an expert in 3D spatial reasoning for robot manipulation on the
    CALVIN play-table benchmark.
    {shared_view_note}

    Your job is to decide whether the gripper is currently positioned closely
    enough around the target object that closing the gripper jaws RIGHT NOW
    would successfully grasp it. Be strict: answer "yes" only if the jaws are
    already enclosing the target. The threshold is 4 cm between gripper
    center and target center.

    OUTPUT FORMAT:
    Respond with EXACTLY one JSON object containing only the key "q3".
    No prose, no markdown, no code fences.

  user: |
    Task description: "{task_description}"

    Q3 — CAN GRIPPER CLOSE NOW:
    Based on the gripper and target positions visible in the images, can
    the gripper close right now to successfully grasp the target?

    Output format:
      {{"q3": {{"can_close": "yes" | "no"}}}}

# ---------------------------------------------------------------------------
# Q4: next-movement unit direction vector
# ---------------------------------------------------------------------------
q4:
  system: |
    You are an expert in 3D spatial reasoning for robot manipulation on the
    CALVIN play-table benchmark.
    {shared_view_note}
    {shared_frame_block}

    OUTPUT FORMAT:
    Respond with EXACTLY one JSON object containing only the key "q4".
    No prose, no markdown, no code fences.

  user: |
    Task description: "{task_description}"

    Q4 — NEXT MOVEMENT DIRECTION (world frame unit vector):
    In which 3D direction should the gripper move NEXT to make progress on
    the task? Provide a NORMALIZED unit vector [dx, dy, dz] (length ≈ 1.0)
    in CALVIN world coordinates.

    Output format:
      {{"q4": {{"dx": <float>, "dy": <float>, "dz": <float>}}}}

# ---------------------------------------------------------------------------
# Q5: gripper → target offset vector (not normalized)
# ---------------------------------------------------------------------------
q5:
  system: |
    You are an expert in 3D spatial reasoning for robot manipulation on the
    CALVIN play-table benchmark.
    {shared_view_note}
    {shared_frame_block}

    OUTPUT FORMAT:
    Respond with EXACTLY one JSON object containing only the key "q5".
    No prose, no markdown, no code fences.

  user: |
    Task description: "{task_description}"

    Q5 — GRIPPER-TO-TARGET OFFSET (world frame, meters):
    Compute target_position − gripper_position. Positive dx = target is
    further along world X+ ("in_front"); positive dy = world Y+ ("left");
    positive dz = world Z+ ("above").

    Output format:
      {{"q5": {{"dx": <float_meters>, "dy": <float_meters>, "dz": <float_meters>}}}}

# ---------------------------------------------------------------------------
# Q6: per-axis categorical spatial relation
# ---------------------------------------------------------------------------
q6:
  system: |
    You are an expert in 3D spatial reasoning for robot manipulation on the
    CALVIN play-table benchmark.
    {shared_view_note}

    Use ONLY the exact axis labels listed below — no other words, no
    synonyms. The labels are bound to world-axis SIGNS (not visual image
    directions): the dataset assigns "in_front" iff target is at higher world
    X than the gripper, regardless of how that looks in the image.
    "aligned_*" applies only when the offset on that axis is very small
    (a few centimeters or less).

    OUTPUT FORMAT:
    Respond with EXACTLY one JSON object containing only the key "q6".
    No prose, no markdown, no code fences.

  user: |
    Task description: "{task_description}"

    Q6 — TARGET RELATIVE TO GRIPPER (world axes):
    Describe where the TARGET OBJECT is relative to the GRIPPER on each
    world axis (NOT image directions):
    - X-axis: "in_front" (target_x > gripper_x) | "behind" (target_x < gripper_x) | "aligned_x"
    - Y-axis: "left"     (target_y > gripper_y) | "right"  (target_y < gripper_y) | "aligned_y"
    - Z-axis: "above"    (target_z > gripper_z) | "below"  (target_z < gripper_z) | "aligned_z"

    Output format:
      {{"q6": {{"x": <x-label>, "y": <y-label>, "z": <z-label>}}}}
