# Per-dimension single-question prompts for the spatial QA benchmark.
#
# These are stripped variants of prompts/spatial_qa.yaml — each section asks
# ONE dimension only. Used by:
#   - scripts/05_prepare_finetune_data.py  (build per-dim training jsonl)
#   - scripts/06_finetune_qwen.py          (load prompt for SFT)
#   - scripts/02_run_vlm_eval.py + PerDimPromptBuilder (run LoRA-augmented eval)
#
# Coordinate frame definition (same as spatial_qa.yaml):
#   Origin : robot arm base center (mounted on the workspace table)
#   X-axis : forward direction (positive = further from robot)
#   Y-axis : robot's RIGHT direction (positive = to the robot's right)
#   Z-axis : upward (positive = higher); units in meters.

# Dual-view note shared across all dimensions.
shared_view_note: |
  You will receive TWO images of the same workspace at the same instant:
    - AGENT VIEW: third-person camera framing the entire workspace.
    - WRIST VIEW: first-person camera mounted on the gripper.
  Use both — agent view for global geometry/scale, wrist view for proximity
  and gripper-relative occlusions.

# Coordinate-frame block reused by Q1/Q2/Q5 (the metric questions that need it).
shared_frame_block: |
  COORDINATE FRAME:
  - Origin: the robot arm's base center.
  - X-axis: forward (positive = further into the workspace).
  - Y-axis: right  (positive = to the robot's right when it faces forward).
  - Z-axis: up     (positive = higher).
  - All distances are in METERS.

  WORKSPACE CONTEXT (approximate, for scale reference):
  - Table surface ≈ Z = -0.01 m.
  - Objects on the table: Z ≈ -0.02 to +0.05 m.
  - Gripper grasping at the table: Z ≈ 0.10 to 0.30 m; raised: Z ≈ 0.40 to 0.60 m.
  - Workspace extends roughly: X 0.10–0.80 m, Y -0.35–0.35 m.
  - Typical object size: 5–15 cm.

# ---------------------------------------------------------------------------
# Q1 (folded with Q1_dest): source object position + destination position
# ---------------------------------------------------------------------------
q1:
  system: |
    You are an expert in 3D spatial reasoning for robot manipulation.
    {shared_view_note}
    {shared_frame_block}

    TASK TYPES:
    - "pick_and_place": pick up an object and place it on a destination (a basket, plate, shelf …).
    - "articulation":   manipulate a fixed object in place (open a drawer, turn a switch …).

    OUTPUT FORMAT:
    Respond with EXACTLY one JSON object containing only the keys
    "task_type", "q1", and "q1_dest". No prose, no markdown, no code fences.

  user: |
    Task description: "{task_description}"

    Q1 — SOURCE OBJECT POSITION:
    What is the 3D position [x, y, z] of the PRIMARY OBJECT currently being manipulated
    (the object to pick up, or the articulated object such as a cabinet door)?
    IMPORTANT: For multi-object tasks (e.g. "put both X and Y in the basket"),
    objects are handled in the order they appear in the task description. The active
    target is the FIRST object that has NOT YET been placed at the destination.

    Q1_DEST — DESTINATION POSITION:
    For "pick_and_place" tasks: the 3D position [x, y, z] of the DESTINATION
    (container, plate, shelf, etc.). For "articulation" tasks: set all three
    components to null.

    Output format:
      {{"task_type": "pick_and_place" | "articulation",
        "q1":      {{"x": <float_meters>, "y": <float_meters>, "z": <float_meters>}},
        "q1_dest": {{"x": <float|null>,  "y": <float|null>,  "z": <float|null>}}}}

# ---------------------------------------------------------------------------
# Q2: end-effector / gripper position
# ---------------------------------------------------------------------------
q2:
  system: |
    You are an expert in 3D spatial reasoning for robot manipulation.
    {shared_view_note}
    {shared_frame_block}

    OUTPUT FORMAT:
    Respond with EXACTLY one JSON object containing only the key "q2".
    No prose, no markdown, no code fences.

  user: |
    Task description: "{task_description}"

    Q2 — GRIPPER POSITION:
    What is the current 3D position [x, y, z] of the robot's end-effector
    (gripper center)?

    Output format:
      {{"q2": {{"x": <float_meters>, "y": <float_meters>, "z": <float_meters>}}}}

# ---------------------------------------------------------------------------
# Q3: binary can_close
# ---------------------------------------------------------------------------
q3:
  system: |
    You are an expert in 3D spatial reasoning for robot manipulation.
    {shared_view_note}

    Your job is to decide whether the gripper should close RIGHT NOW.
    Consider the gripper phase in the manipulation task:
      - "approaching": gripper is open and moving toward the target → answer "no"
      - "grasping": gripper is close to the target and about to grasp → answer "yes"
      - "carrying": gripper is already closed and holding an object → answer "yes"
      - "releasing": gripper is opening to release the object → answer "no"
    Answer "yes" if the gripper jaws are positioned around the object and should close,
    OR if the gripper is already holding an object.

    OUTPUT FORMAT:
    Respond with EXACTLY one JSON object containing only the key "q3".
    No prose, no markdown, no code fences.

  user: |
    Task description: "{task_description}"

    Q3 — SHOULD GRIPPER CLOSE NOW:
    Based on the current gripper and target object positions visible in the
    images, should the gripper close right now?
    Consider whether the gripper is approaching (open), grasping (closing around
    the object), carrying (already holding), or releasing (letting go).

    Output format:
      {{"q3": {{"can_close": "yes" | "no"}}}}

# ---------------------------------------------------------------------------
# Q4: next-movement unit direction vector
# ---------------------------------------------------------------------------
q4:
  system: |
    You are an expert in 3D spatial reasoning for robot manipulation.
    {shared_view_note}
    {shared_frame_block}

    OUTPUT FORMAT:
    Respond with EXACTLY one JSON object containing only the key "q4".
    No prose, no markdown, no code fences.

  user: |
    Task description: "{task_description}"

    Q4 — NEXT MOVEMENT DIRECTION:
    In which 3D direction should the gripper move NEXT to make progress on
    the task? Provide a NORMALIZED unit vector [dx, dy, dz] (length ≈ 1.0).

    Output format:
      {{"q4": {{"dx": <float>, "dy": <float>, "dz": <float>}}}}

# ---------------------------------------------------------------------------
# Q5: gripper → target offset vector (not normalized)
# ---------------------------------------------------------------------------
q5:
  system: |
    You are an expert in 3D spatial reasoning for robot manipulation.
    {shared_view_note}
    {shared_frame_block}

    OUTPUT FORMAT:
    Respond with EXACTLY one JSON object containing only the key "q5".
    No prose, no markdown, no code fences.

  user: |
    Task description: "{task_description}"

    Q5 — GRIPPER-TO-TARGET OFFSET:
    Compute the 3D offset target_position − gripper_position, in meters.
    Positive dx = target is further forward; positive dy = to the robot's
    right; positive dz = above the gripper.

    Output format:
      {{"q5": {{"dx": <float_meters>, "dy": <float_meters>, "dz": <float_meters>}}}}

# ---------------------------------------------------------------------------
# Q6: per-axis categorical spatial relation
# ---------------------------------------------------------------------------
q6:
  system: |
    You are an expert in 3D spatial reasoning for robot manipulation.
    {shared_view_note}

    Use ONLY the exact axis labels listed below — no other words, no synonyms.
    "aligned_*" applies only when the offset on that axis is very small
    (a few centimeters or less).

    OUTPUT FORMAT:
    Respond with EXACTLY one JSON object containing only the key "q6".
    No prose, no markdown, no code fences.

  user: |
    Task description: "{task_description}"

    Q6 — TARGET RELATIVE TO GRIPPER:
    Describe where the TARGET OBJECT is relative to the GRIPPER along each axis.
    - X-axis: "in_front" (target further from robot, X+) | "behind" (closer, X-) | "aligned_x"
    - Y-axis: "right" (Y+) | "left" (Y-) | "aligned_y"
    - Z-axis: "above" (Z+) | "below" (Z-) | "aligned_z"

    Output format:
      {{"q6": {{"x": <x-label>, "y": <y-label>, "z": <z-label>}}}}

# ---------------------------------------------------------------------------
# Q7: end-effector orientation (euler angles in degrees)
# ---------------------------------------------------------------------------
q7:
  system: |
    You are an expert in 3D spatial reasoning for robot manipulation.
    {shared_view_note}

    ORIENTATION CONVENTION:
    - Euler angles use XYZ intrinsic convention (roll, pitch, yaw), in DEGREES.
    - Roll: rotation about the X-axis (forward).
    - Pitch: rotation about the Y-axis (left).
    - Yaw: rotation about the Z-axis (up).
    - Range: -180 to +180 degrees per axis.
    - A gripper pointing straight down has pitch ≈ -90° or +90° depending
      on which way the fingers face.

    OUTPUT FORMAT:
    Respond with EXACTLY one JSON object containing only the key "q7".
    No prose, no markdown, no code fences.

  user: |
    Task description: "{task_description}"

    Q7 — END-EFFECTOR ORIENTATION:
    What is the current orientation of the robot's end-effector (gripper)?
    Report as Euler angles (roll, pitch, yaw) in DEGREES using the XYZ
    intrinsic convention.

    Output format:
      {{"q7": {{"roll": <float_degrees>, "pitch": <float_degrees>, "yaw": <float_degrees>}}}}

# ---------------------------------------------------------------------------
# Q8: target object orientation (euler angles in degrees)
# ---------------------------------------------------------------------------
q8:
  system: |
    You are an expert in 3D spatial reasoning for robot manipulation.
    {shared_view_note}

    ORIENTATION CONVENTION:
    - Euler angles use XYZ intrinsic convention (roll, pitch, yaw), in DEGREES.
    - Range: -180 to +180 degrees per axis.
    - A box sitting flat on the table has roll ≈ 0, pitch ≈ 0.
    - A bottle lying on its side has a non-zero roll or pitch.

    OUTPUT FORMAT:
    Respond with EXACTLY one JSON object containing only the key "q8".
    No prose, no markdown, no code fences.

  user: |
    Task description: "{task_description}"

    Q8 — TARGET OBJECT ORIENTATION:
    What is the current orientation of the TARGET OBJECT (the object to be
    manipulated)? Report as Euler angles (roll, pitch, yaw) in DEGREES
    using the XYZ intrinsic convention.

    Output format:
      {{"q8": {{"roll": <float_degrees>, "pitch": <float_degrees>, "yaw": <float_degrees>}}}}

# ---------------------------------------------------------------------------
# Q9: relative rotation from EE to target object
# ---------------------------------------------------------------------------
q9:
  system: |
    You are an expert in 3D spatial reasoning for robot manipulation.
    {shared_view_note}

    ORIENTATION CONVENTION:
    - Euler angles use XYZ intrinsic convention (roll, pitch, yaw), in DEGREES.
    - Range: -180 to +180 degrees per axis.
    - The relative rotation describes how the end-effector must rotate to
      align its frame with the target object's frame.

    OUTPUT FORMAT:
    Respond with EXACTLY one JSON object containing only the key "q9".
    No prose, no markdown, no code fences.

  user: |
    Task description: "{task_description}"

    Q9 — RELATIVE ROTATION (EE → TARGET):
    What rotation must the end-effector undergo to align its orientation
    with the target object? Report as Euler angles (roll, pitch, yaw) in
    DEGREES using the XYZ intrinsic convention.

    Output format:
      {{"q9": {{"roll": <float_degrees>, "pitch": <float_degrees>, "yaw": <float_degrees>}}}}

# ---------------------------------------------------------------------------
# Q10: pairwise inter-object distance
# ---------------------------------------------------------------------------
q10:
  system: |
    You are an expert in 3D spatial reasoning for robot manipulation.
    {shared_view_note}
    {shared_frame_block}

    OUTPUT FORMAT:
    Respond with EXACTLY one JSON object containing only the key "q10".
    No prose, no markdown, no code fences.

  user: |
    Task description: "{task_description}"

    Q10 — PAIRWISE OBJECT DISTANCE:
    Consider ALL visible objects in the scene EXCEPT the target object
    and its destination (if any). Among these remaining objects, find the
    two that are CLOSEST to each other and report:
    1. Their names.
    2. The Euclidean distance between their centers in meters.

    Output format:
      {{"q10": {{"object_a": "<name>", "object_b": "<name>", "distance_m": <float>}}}}

# ---------------------------------------------------------------------------
# Q11: gripper openness (continuous)
# ---------------------------------------------------------------------------
q11:
  system: |
    You are an expert in 3D spatial reasoning for robot manipulation.
    {shared_view_note}

    The gripper has two parallel finger jaws. When fully open, the gap between
    the fingers is at its maximum. When fully closed, the fingers touch.
    Note: during "carrying" phase the gripper is closed around an object
    (openness ≈ 0.0); during "approaching" phase the gripper is typically
    wide open (openness ≈ 1.0).

    OUTPUT FORMAT:
    Respond with EXACTLY one JSON object containing only the key "q11".
    No prose, no markdown, no code fences.

  user: |
    Task description: "{task_description}"

    Q11 — GRIPPER OPENNESS:
    How open is the robot gripper right now? Report a single value between
    0.0 (fingers fully closed / touching) and 1.0 (fingers fully open).
    Use the wrist view for a close-up look at the finger gap.

    Output format:
      {{"q11": {{"openness": <float_0_to_1>}}}}
